<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Soft Glow Filter -->
    <filter id="foot-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <radialGradient id="disc-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.0" />
    </radialGradient>

    <linearGradient id="foot-grad-left" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <linearGradient id="foot-grad-right" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
  </defs>

  <!-- Ground Disc -->
  <ellipse cx="100" cy="100" rx="88" ry="88" fill="url(#disc-shadow)" />
  <circle cx="100" cy="100" r="76" fill="rgba(15, 23, 42, 0.65)" stroke="#ffd700" stroke-width="2.5" stroke-dasharray="10 5" filter="url(#foot-glow)" />

  <!-- Directional Ripple Wave at Front -->
  <path d="M 68 45 Q 100 22 132 45" fill="none" stroke="#ffd700" stroke-width="3" stroke-linecap="round" opacity="0.85" filter="url(#foot-glow)" />
  <path d="M 76 34 Q 100 16 124 34" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6" filter="url(#foot-glow)" />

  <!-- LEFT FOOT (Staggered Behind) -->
  <g transform="translate(62, 92) rotate(-5)" filter="url(#foot-glow)">
    <!-- Heel -->
    <ellipse cx="16" cy="46" rx="10" ry="11" fill="url(#foot-grad-left)" stroke="#ffffff" stroke-width="1.5" />
    <!-- Sole (Front Foot) -->
    <path d="M 6 18 C 6 8, 14 0, 22 0 C 29 0, 33 8, 30 18 C 28 26, 25 32, 21 34 C 17 32, 7 27, 6 18 Z" 
          fill="url(#foot-grad-left)" stroke="#ffffff" stroke-width="1.5" />
  </g>

  <!-- RIGHT FOOT (Stepped Forward) -->
  <g transform="translate(108, 54) rotate(4)" filter="url(#foot-glow)">
    <!-- Heel -->
    <ellipse cx="16" cy="46" rx="10.5" ry="11.5" fill="url(#foot-grad-right)" stroke="#ffffff" stroke-width="1.5" />
    <!-- Sole (Front Foot) -->
    <path d="M 5 18 C 5 8, 14 0, 22 0 C 30 0, 34 8, 31 18 C 29 26, 26 32, 22 34 C 18 32, 7 27, 5 18 Z" 
          fill="url(#foot-grad-right)" stroke="#ffffff" stroke-width="1.5" />
  </g>
</svg>
