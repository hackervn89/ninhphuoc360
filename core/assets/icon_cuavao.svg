<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <defs>
    <!-- Soft Glow Filter -->
    <filter id="door-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="door-frame-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="portal-light" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="door-arrow-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="100" cy="206" rx="72" ry="10" fill="rgba(0,0,0,0.5)" />

  <!-- Outer Portal Arch Frame -->
  <path d="M 45 200 L 45 95 A 55 55 0 0 1 155 95 L 155 200 Z" 
        fill="rgba(10, 15, 30, 0.85)" 
        stroke="url(#door-frame-grad)" 
        stroke-width="7" 
        stroke-linejoin="round"
        filter="url(#door-glow)" />

  <!-- Inner Portal Space (Gateway Light) -->
  <path d="M 54 198 L 54 95 A 46 46 0 0 1 146 95 L 146 198 Z" 
        fill="url(#portal-light)" />

  <!-- Door Threshold Base Step -->
  <rect x="36" y="196" width="128" height="10" rx="4" fill="url(#door-frame-grad)" filter="url(#door-glow)" />
  <rect x="42" y="194" width="116" height="3" fill="#ffffff" opacity="0.8" />

  <!-- Architectural Keystones / Accents on Arch -->
  <polygon points="100,32 93,45 107,45" fill="#ffd700" />
  <circle cx="100" cy="50" r="4" fill="#ffffff" />

  <!-- Forward Perspective Floor Lines -->
  <polygon points="100,120 70,195 130,195" fill="rgba(255,255,255,0.15)" />

  <!-- Glowing Forward Arrow Entering the Door -->
  <g filter="url(#door-glow)">
    <polygon points="100,98 122,126 112,126 100,111 88,126 78,126" fill="url(#door-arrow-grad)" />
    <polygon points="100,124 116,146 108,146 100,135 92,146 84,146" fill="#ffffff" opacity="0.9" />
    <circle cx="100" cy="160" r="5.5" fill="#ffd700" stroke="#ffffff" stroke-width="2" />
  </g>
</svg>
